name = "toolbelt"
version = "1.0.1"
description = "Read-only rg, fd, ast-grep, and rga wrappers for fast codebase and document search."
category = "tools"
requires = ">=1.0.0"
keywords = ["search", "files", "code", "documents"]
license = "MIT"

[provides]
tools = ["grep", "find", "code_search", "doc_search"]
hooks = ["kernel/doctor"]
