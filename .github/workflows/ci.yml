name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      specs: ${{ steps.classify.outputs.specs }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          GROUPS = ("code", "specs", "docs")
          ZERO_SHA = "0" * 40
          IMAGE_EXTS = (".png", ".svg", ".gif", ".webp", ".jpg", ".jpeg", ".ico", ".mp4", ".cast")

          def git(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=False)

          def write_outputs(flags: dict[str, bool], reason: str) -> None:
              print(f"plugins-changes: {reason}")
              lines = [f"{k}={'true' if flags[k] else 'false'}" for k in GROUPS]
              print("\n".join(lines))
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")

          def all_true(reason: str) -> None:
              write_outputs({k: True for k in GROUPS}, reason)

          def changed_files(base: str) -> list[str] | None:
              if git("cat-file", "-e", f"{base}^{{commit}}").returncode != 0:
                  if git("fetch", "--no-tags", "--depth=1", "origin", base).returncode != 0:
                      return None
              res = git("diff", "--name-only", "--no-renames", "-z", base, "HEAD", "--")
              if res.returncode != 0:
                  return None
              return [p for p in res.stdout.split("\0") if p]

          def classify(files: list[str]) -> dict[str, bool]:
              flags = {k: False for k in GROUPS}
              for path in files:
                  matched = False
                  if path in (".github/workflows/ci.yml", ".mare-version", ".github/ci-tools.json"):
                      return {k: True for k in GROUPS}
                  is_plugin_readme = fnmatch.fnmatch(path, "plugins/*/README*.md")
                  is_image = path.lower().endswith(IMAGE_EXTS)
                  if (
                      (path.startswith("plugins/") and not is_plugin_readme and not is_image)
                      or path.startswith(("types/", "tests/", "themes/"))
                      or path == "scripts/lua_api_rules.py"
                  ):
                      flags["code"] = True
                      flags["specs"] = True
                      matched = True
                  if (
                      path.startswith(("scripts/", ".github/"))
                      or path in (
                          "plugins.toml",
                          "mare-plugin.toml",
                          "justfile",
                          ".release-please-manifest.json",
                          "release-please-config.json",
                          "CHANGELOG.md",
                          "NEWS.md",
                      )
                  ):
                      flags["code"] = True
                      matched = True
                  if (
                      is_plugin_readme
                      or is_image
                      or path.startswith("docs/")
                      or fnmatch.fnmatch(path, "README*.md")
                      or path in (
                          "CONTRIBUTING.md",
                          "SECURITY.md",
                          "THIRD_PARTY_NOTICES.md",
                          "LICENSE",
                          ".gitignore",
                      )
                  ):
                      flags["docs"] = True
                      matched = True
                  if not matched:
                      return {k: True for k in GROUPS}
              return flags

          event = os.environ.get("EVENT_NAME", "")
          if event == "workflow_dispatch":
              all_true("workflow_dispatch runs full CI")
          elif event == "pull_request":
              if git("rev-parse", "--verify", "HEAD^2").returncode == 0:
                  files = changed_files("HEAD^1")
              else:
                  base = os.environ.get("PR_BASE_SHA", "")
                  files = changed_files(base) if base else None
              if not files:
                  all_true("unable to resolve PR diff; running full CI")
              else:
                  print(f"changed files ({len(files)}): {files}")
                  write_outputs(classify(files), "pull_request path classification")
          elif event == "push":
              before = os.environ.get("PUSH_BEFORE_SHA", "")
              has_parent = git("rev-parse", "--verify", "HEAD^1").returncode == 0
              if not has_parent or not before or before == ZERO_SHA:
                  all_true("orphan or initial push has no diff base; running full CI")
              else:
                  files = changed_files(before)
                  if not files:
                      all_true("unable to diff push base; running full CI")
                  else:
                      print(f"changed files ({len(files)}): {files}")
                      write_outputs(classify(files), "push path classification")
          else:
              all_true(f"event {event!r} runs full CI")
          PY

  verify:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load pinned CI tool versions
        if: needs.changes.outputs.code == 'true'
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          stylua_ver="$(jq -er '.stylua | strings' .github/ci-tools.json)"
          ast_grep_ver="$(jq -er '.ast_grep.version | strings' .github/ci-tools.json)"
          ast_grep_sha="$(jq -er '.ast_grep.sha256 | strings' .github/ci-tools.json)"
          {
            echo "stylua=${stylua_ver}"
            echo "ast_grep_version=${ast_grep_ver}"
            echo "ast_grep_sha256=${ast_grep_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Lua and ast-grep
        if: needs.changes.outputs.code == 'true'
        shell: bash
        env:
          AST_GREP_VER: ${{ steps.tools.outputs.ast_grep_version }}
          AST_GREP_SHA: ${{ steps.tools.outputs.ast_grep_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4
          if ! command -v lua >/dev/null 2>&1; then
            sudo ln -s /usr/bin/lua5.4 /usr/local/bin/lua
          fi
          lua -v
          tools_dir="${RUNNER_TEMP}/lua-lint-tools"
          mkdir -p "${tools_dir}/bin"
          curl -fsSL -o "${tools_dir}/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VER}/app-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "${AST_GREP_SHA}" "${tools_dir}/ast-grep.zip" | sha256sum -c -
          unzip -q "${tools_dir}/ast-grep.zip" -d "${tools_dir}/bin"
          rm -f "${tools_dir}/ast-grep.zip"
          echo "${tools_dir}/bin" >> "$GITHUB_PATH"

      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        if: needs.changes.outputs.code == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.tools.outputs.stylua }}
          args: --check plugins types tests

      - name: Validate manifests, contracts, CI policy, and Lua public API
        if: needs.changes.outputs.code == 'true'
        run: |
          python3 tests/manifests.py
          python3 tests/test_manifests.py
          python3 tests/test_ci_workflow.py
          lua tests/service-contracts.lua
          python3 scripts/lua_api_rules.py --self-test
          python3 tests/test_lua_api_rules.py
          python3 scripts/lua_api_rules.py

      - name: Check relative Markdown links
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          files = (
              list(root.glob("README*.md"))
              + list(root.glob("docs/*.md"))
              + list(root.glob("plugins/*/README.md"))
          )
          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          broken = []

          for md in sorted(files):
              text = md.read_text(encoding="utf-8")
              for match in link_re.finditer(text):
                  target = match.group(1).strip().split()[0]
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path_part = target.split("#", 1)[0]
                  if not path_part:
                      continue
                  resolved = (md.parent / path_part).resolve()
                  if not resolved.exists():
                      broken.append((str(md.relative_to(root)), target))

          print(f"Checked {len(files)} markdown files; broken={len(broken)}")
          for src, target in broken:
              print(f"ERROR: broken relative link in {src}: {target}", file=sys.stderr)
          if broken:
              sys.exit(1)
          PY

  check-mare-release:
    # Checks whether the pinned Mare release tag in `.mare-version` is published.
    # Before `v1.0.0` exists, `.mare-version == v1.0.0` returning HTTP 404 sets
    # `available=false` so the `specs` job reports an explicit GitHub Actions
    # `skipped` status instead of silently passing green. Once `v1.0.0` is
    # published (or if `.mare-version` points to any other missing tag), a 404
    # fails CI immediately.
    needs: [changes]
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.mare_release.outputs.available }}
      mare_version: ${{ steps.mare_release.outputs.mare_version }}
      ast_grep_version: ${{ steps.mare_release.outputs.ast_grep_version }}
      ast_grep_sha256: ${{ steps.mare_release.outputs.ast_grep_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load pinned Mare and ast-grep versions
        id: mare_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mare_ver="$(tr -d '[:space:]' < .mare-version)"
          if [[ ! "$mare_ver" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            printf '::error::Invalid .mare-version value: %s\n' "$mare_ver"
            exit 1
          fi
          ast_grep_ver="$(jq -er '.ast_grep.version | strings' .github/ci-tools.json)"
          ast_grep_sha="$(jq -er '.ast_grep.sha256 | strings' .github/ci-tools.json)"
          {
            echo "mare_version=${mare_ver}"
            echo "ast_grep_version=${ast_grep_ver}"
            echo "ast_grep_sha256=${ast_grep_sha}"
          } >> "$GITHUB_OUTPUT"

          http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/signalridge/mare/releases/tags/${mare_ver}")"
          if [[ "$http_code" == "200" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$http_code" == "404" ]]; then
            if [[ "$mare_ver" == "v1.0.0" ]]; then
              printf '::warning::Mare v1.0.0 is not published yet (HTTP 404); '
              printf 'marking specs job as skipped until v1.0.0 is released.\n'
              echo "available=false" >> "$GITHUB_OUTPUT"
            else
              v1_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/signalridge/mare/releases/tags/v1.0.0")"
              if [[ "$v1_code" == "200" ]]; then
                printf '::error::Mare v1.0.0 is already published; '
                printf 'missing release %s (HTTP 404) cannot skip specs.\n' "$mare_ver"
              else
                printf '::error::Mare release %s not found (HTTP 404); ' "$mare_ver"
                printf 'pre-release skip is only allowed while bootstrapping v1.0.0.\n'
              fi
              exit 1
            fi
          else
            printf '::error::Unexpected HTTP %s while checking signalridge/mare release %s\n' \
              "$http_code" "$mare_ver"
            exit 1
          fi

  specs:
    # Runs all Lua unit specs and types-backed Lua public API checks against the
    # Mare release tag declared in `.mare-version`. Release integrity is verified
    # cryptographically via cosign (`checksums.txt.sigstore.json`) and `checksums.txt`
    # instead of hardcoding archive hashes. Note: `just test` (E2E) requires a
    # `--features faux` build (stripped from release binaries by design) plus
    # `mmdc >= 12`, so E2E runs in integration/acceptance.
    needs: [check-mare-release]
    if: needs.check-mare-release.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install ast-grep and verified Mare release
        shell: bash
        env:
          MARE_VER: ${{ needs.check-mare-release.outputs.mare_version }}
          AST_GREP_VER: ${{ needs.check-mare-release.outputs.ast_grep_version }}
          AST_GREP_SHA: ${{ needs.check-mare-release.outputs.ast_grep_sha256 }}
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/mare-ci-tools"
          mkdir -p "${tools_dir}/bin" "${tools_dir}/mare"
          curl -fsSL -o "${tools_dir}/ast-grep.zip" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VER}/app-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "${AST_GREP_SHA}" "${tools_dir}/ast-grep.zip" | sha256sum -c -
          unzip -q "${tools_dir}/ast-grep.zip" -d "${tools_dir}/bin"
          rm -f "${tools_dir}/ast-grep.zip"
          echo "${tools_dir}/bin" >> "$GITHUB_PATH"

          base_url="https://github.com/signalridge/mare/releases/download/${MARE_VER}"
          archive="mare-${MARE_VER}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "${tools_dir}/checksums.txt" "${base_url}/checksums.txt"
          curl -fsSL -o "${tools_dir}/checksums.txt.sigstore.json" "${base_url}/checksums.txt.sigstore.json"
          cert_id="https://github.com/signalridge/mare/.github/workflows/release.yaml@refs/tags/${MARE_VER}"
          cosign verify-blob \
            --bundle "${tools_dir}/checksums.txt.sigstore.json" \
            --certificate-identity "${cert_id}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${tools_dir}/checksums.txt"

          curl -fsSL -o "${tools_dir}/${archive}" "${base_url}/${archive}"
          (
            cd "${tools_dir}"
            match_count="$(grep -c -F "  ${archive}" checksums.txt || true)"
            if [[ "$match_count" -ne 1 ]]; then
              printf '::error::Expected exactly 1 checksum entry for %s in checksums.txt, found %s\n' \
                "$archive" "$match_count"
              exit 1
            fi
            grep -F "  ${archive}" checksums.txt | sha256sum -c -
          )
          tar -xzf "${tools_dir}/${archive}" -C "${tools_dir}/mare"
          rm -f "${tools_dir}/${archive}" "${tools_dir}/checksums.txt" "${tools_dir}/checksums.txt.sigstore.json"
          mare_dir="${tools_dir}/mare/mare-${MARE_VER}-x86_64-unknown-linux-gnu"
          echo "MARE_DIR=${mare_dir}" >> "$GITHUB_ENV"
          echo "MARE_BIN=${mare_dir}/mare" >> "$GITHUB_ENV"

      - name: Run Lua unit specs and types-backed API rules
        shell: bash
        run: |
          set -euo pipefail
          "${MARE_BIN}" --version
          ./tests/run-specs.sh
          python3 scripts/lua_api_rules.py --types-dir "${MARE_DIR}/types"
